<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src blob:">
<style>
  :root { --ease: cubic-bezier(.32,.72,0,1); --clay:#D97757; --sand:#E8B98A; --green:#5DCAA5; --amber:#F2C14E; --red:#E24B4A; --fable:#E8B98A; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:transparent; overflow:hidden; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; user-select:none; }
  .stage { display:flex; justify-content:center; padding-top:2px; }
  .isl { position:relative; overflow:hidden; background:#0b0b0b; color:#fff; cursor:pointer;
    width:250px; height:36px; border-radius:18px;
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
    transition:width .55s var(--ease), height .55s var(--ease), border-radius .55s var(--ease), transform .25s var(--ease), box-shadow .3s; }
  .isl:hover:not(.open) { transform:scale(1.04); }
  .isl.alert { box-shadow:0 0 0 2px var(--sev); }
  .mini { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:13px; gap:10px; white-space:nowrap; transition:opacity .2s, filter .2s; }
  .isl.open .mini { opacity:0; filter:blur(4px); pointer-events:none; }
  .mini .l { display:flex; align-items:center; gap:8px; }
  .mini .mid { color:#a9a9a9; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--clay); flex:none; }
  .act { width:9px; height:9px; border-radius:50%; background:#5a5a5a; flex:none; transition:background .3s; }
  .act.ready { background:#f2f2f2; animation:breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:.35; transform:scale(.8) } 50% { opacity:1; transform:scale(1); box-shadow:0 0 6px rgba(255,255,255,.5) } }
  .act.working { background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 1.4s ease-in-out infinite; }
  .act.needs { background:var(--red); box-shadow:0 0 8px var(--red); animation:pulse .7s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
  .pop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; opacity:0; transform:scale(.9); transition:opacity .25s, transform .35s var(--ease); pointer-events:none; }
  .isl.popping .pop { opacity:1; transform:scale(1); }
  .isl.popping .mini { opacity:0; }
  .det { position:absolute; top:0; left:50%; width:380px; padding:16px 0 14px; opacity:0; filter:blur(6px);
    transform:translateX(-50%) scale(.92); transition:opacity .25s, filter .25s, transform .45s var(--ease); }
  .isl.open .det { opacity:1; filter:blur(0); transform:translateX(-50%) scale(1); transition-delay:.12s; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .lbl { font-size:12px; color:#a9a9a9; }
  .val { font-size:12px; color:#e8e8e8; }
  .bar { height:6px; border-radius:3px; background:#262626; overflow:hidden; margin:6px 0 4px; }
  .bar > i { display:block; height:100%; border-radius:3px; width:0; transition:width .8s var(--ease) .2s; }
  .sec { margin-top:11px; }
  .hr { margin-top:11px; padding-top:10px; border-top:1px solid #222; }
  .hist { display:flex; align-items:flex-end; gap:6px; height:30px; margin-top:6px; }
  .hist div { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .hist b { display:block; width:100%; border-radius:2px; background:#3a3a3a; min-height:2px; }
  .hist b.today { background:var(--clay); }
  .hist span { font-size:10px; color:#777; }
  .stale { color:var(--amber); }
  .dots { display:flex; gap:4px; align-items:center; }
  .srow { display:grid; grid-template-columns:12px minmax(0,1fr) auto; column-gap:8px; align-items:center; padding:5px 0; }
  .srow .p { font-size:12.5px; color:#eee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srow .s { font-size:12px; color:#a9a9a9; white-space:nowrap; }
  .srow .s.red { color:var(--red); } .srow .s.grn { color:var(--green); } .srow .s.wht { color:#eee; }
  .srow .d { grid-column:2 / 4; font-size:11.5px; color:#8a8a8a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="stage">
  <div class="isl" id="isl">
    <div class="mini" id="mini">
      <span class="l"><span class="dots" id="dots"><span class="act"></span></span><span id="m5">Waiting for Claude Code</span></span>
      <span class="mid" id="mReset"></span>
      <span id="mWk"></span>
    </div>
    <div class="pop" id="pop"><span class="dot" id="popDot"></span><span id="popText">Limit refreshed</span></div>
    <div class="det" id="det">
      <div class="row"><span class="lbl">Claude sessions</span><span class="lbl" id="dSessionAge" style="white-space:nowrap"></span></div>
      <div id="sessList" style="margin-top:4px"></div>

      <div class="sec">
        <div class="lbl">Current session (5-hour window)</div>
        <div class="bar"><i id="b5"></i></div>
        <div class="row lbl"><span id="d5">-</span><span id="d5r">-</span></div>
      </div>

      <div class="sec" id="weekSec">
        <div class="lbl">This week · all models</div>
        <div class="bar"><i id="bWk" style="background:var(--clay)"></i></div>
        <div class="row lbl"><span id="dWk">-</span><span id="dWkr">-</span></div>
        <div class="lbl" id="dPace" style="margin-top:4px"></div>
      </div>

      <div class="sec hidden" id="fableSec">
        <div class="lbl">This week · Fable</div>
        <div class="bar"><i id="bFa" style="background:var(--fable)"></i></div>
        <div class="row lbl"><span id="dFa">-</span><span id="dFar">-</span></div>
      </div>

      <div class="hr">
        <div class="row"><span class="lbl">Burn rate</span><span class="val" id="dRate">-</span></div>
        <div class="row" style="margin-top:4px"><span class="lbl">Forecast</span><span class="val" id="dForecast">-</span></div>
      </div>

      <div class="hr">
        <div class="lbl">Last 7 days</div>
        <div class="hist" id="hist"></div>
      </div>

      <div class="row hr lbl"><span id="dCtx"></span><span id="dUpdated"></span></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const isl = $('isl'), det = $('det');
const FIVE_H = 5 * 3600e3, WEEK = 7 * 24 * 3600e3, STALE = 10 * 60e3;
let data = null, activity = null, lastAct = 'idle-init', open = false, lastSev = 0, lastFiveReset = null, lastFivePct = null, collapseTimer = null, popTimer = null;

const sevOf = (p) => p == null ? 0 : p >= 95 ? 3 : p >= 80 ? 2 : p >= 50 ? 1 : 0;
const sevColor = (s) => s >= 3 ? 'var(--red)' : s >= 2 ? 'var(--amber)' : 'var(--clay)';
const barColor = (p) => p >= 95 ? 'var(--red)' : p >= 80 ? 'var(--amber)' : 'var(--clay)';
const pct = (p) => p == null ? '-' : Math.round(p) + '%';
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dayClock = (ms) => new Date(ms).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
function dur(ms) {
  if (ms <= 0) return 'now';
  const m = Math.round(ms / 60e3), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${mm}m`;
  return `${mm}m`;
}

function burnRate() {
  if (!data || !data.five || !Array.isArray(data.samples)) return null;
  const now = Date.now();
  const s = data.samples.filter(x => x.fiveReset === data.five.resetsAt && x.t > now - 60 * 60e3);
  if (s.length < 2) return null;
  const a = s[0], b = s[s.length - 1], hrs = (b.t - a.t) / 3600e3;
  if (hrs < 5 / 60) return null;
  return Math.max(0, (b.five - a.five) / hrs);
}

function history() {
  const out = [];
  const samples = (data && data.samples) || [];
  const start = new Date(); start.setHours(0, 0, 0, 0);
  for (let i = 6; i >= 0; i--) {
    const d0 = start.getTime() - i * 864e5, d1 = d0 + 864e5;
    let sum = 0, prev = null;
    for (const x of samples) {
      if (x.week == null) continue;
      if (prev != null && x.t >= d0 && x.t < d1 && x.week > prev) sum += x.week - prev;
      prev = x.week;
    }
    out.push({ label: new Date(d0).toLocaleDateString([], { weekday: 'narrow' }), v: sum, today: i === 0 });
  }
  return out;
}

function popMsg(text, color) {
  $('popText').textContent = text;
  $('popDot').style.background = color || 'var(--clay)';
  isl.classList.add('popping');
  clearTimeout(popTimer);
  popTimer = setTimeout(() => isl.classList.remove('popping'), 3500);
}

function render() {
  const now = Date.now();
  if (!data || (!data.five && !data.week)) {
    $('m5').textContent = 'Waiting for Claude Code';
    $('mReset').textContent = ''; $('mWk').textContent = '';
    isl.style.setProperty('--sev', '#666');
    return;
  }
  const five = data.five, week = data.week, fable = data.fable;
  const stale = now - data.updatedAt > STALE;
  const fiveExpired = five && five.resetsAt && now > five.resetsAt;
  const fivePct = fiveExpired ? 0 : five ? five.pct : null;

  const sev = Math.max(sevOf(fivePct), sevOf(week && week.pct));
  isl.style.setProperty('--sev', sevColor(sev));

  if (sev > lastSev && sev >= 2) {
    isl.classList.add('alert');
    setTimeout(() => isl.classList.remove('alert'), 2500);
    popMsg(sev >= 3 ? `Session at ${pct(fivePct)}, almost out` : `Heads up, session at ${pct(fivePct)}`, sev >= 3 ? 'var(--red)' : 'var(--amber)');
  }
  lastSev = sev;

  if (five && lastFiveReset && five.resetsAt && five.resetsAt > lastFiveReset + 60e3 && lastFivePct > 5) popMsg('Limit refreshed');
  if (five) { lastFiveReset = five.resetsAt; lastFivePct = five.pct; }

  $('m5').textContent = '5h ' + pct(fivePct);
  $('m5').style.color = fivePct >= 95 ? 'var(--red)' : fivePct >= 80 ? 'var(--amber)' : '#fff';
  $('mReset').textContent = fiveExpired ? 'reset' : five && five.resetsAt ? clock(five.resetsAt) : '';
  $('mReset').className = 'mid' + (stale ? ' stale' : '');
  $('mWk').textContent = week ? 'wk ' + pct(week.pct) : '';

  if (five && five.resetsAt && !fiveExpired) {
    $('dSessionAge').textContent = '5h window started ' + dur(now - (five.resetsAt - FIVE_H)) + ' ago';
    $('d5').textContent = pct(fivePct) + ' used';
    $('d5r').textContent = `Resets in ${dur(five.resetsAt - now)} · ${clock(five.resetsAt)}`;
  } else {
    $('dSessionAge').textContent = '';
    $('d5').textContent = fiveExpired ? 'Window reset' : pct(fivePct) + ' used';
    $('d5r').textContent = fiveExpired ? 'Starts with your next message' : '';
  }

  if (week) {
    $('dWk').textContent = pct(week.pct) + ' used';
    $('dWkr').textContent = week.resetsAt ? 'Resets ' + dayClock(week.resetsAt) : '';
    if (week.resetsAt) {
      const elapsed = Math.min(1, Math.max(0, 1 - (week.resetsAt - now) / WEEK));
      const day = Math.min(7, Math.floor(elapsed * 7) + 1);
      const target = elapsed * 100, diff = week.pct - target;
      $('dPace').textContent = `Day ${day} of 7 · ` + (diff > 8 ? `ahead of pace by ${Math.round(diff)}%, slow down` : diff < -8 ? 'well under pace' : 'on track');
      $('dPace').style.color = diff > 8 ? 'var(--amber)' : '#a9a9a9';
    }
  }
  $('weekSec').classList.toggle('hidden', !week);
  $('fableSec').classList.toggle('hidden', !fable);
  if (fable) {
    $('dFa').textContent = pct(fable.pct) + ' used';
    $('dFar').textContent = fable.resetsAt ? 'Resets ' + dayClock(fable.resetsAt) : '';
  }

  const rate = fiveExpired ? null : burnRate();
  $('dRate').textContent = rate == null ? 'Not enough data yet' : rate < 0.5 ? 'Idle' : `~${Math.round(rate)}% per hour`;
  let fc = 'Comfortable until reset';
  if (rate && rate >= 0.5 && five && five.resetsAt && !fiveExpired) {
    const hitAt = now + ((100 - fivePct) / rate) * 3600e3;
    if (hitAt < five.resetsAt) fc = `You'll hit the limit around ${clock(hitAt)}`;
  }
  if (fiveExpired) fc = 'Fresh window ready';
  $('dForecast').textContent = fc;
  $('dForecast').style.color = fc.startsWith('You') ? 'var(--amber)' : '#e8e8e8';

  const h = history(), max = Math.max(5, ...h.map(x => x.v));
  $('hist').innerHTML = h.map(x => `<div><b class="${x.today ? 'today' : ''}" style="height:${Math.max(2, Math.round((x.v / max) * 24))}px"></b><span>${x.label}</span></div>`).join('');

  const extras = [];
  if (data.model) extras.push(data.model);
  if (data.ctx != null) extras.push('ctx ' + data.ctx + '%');
  if (data.cost != null) extras.push('$' + Number(data.cost).toFixed(2));
  $('dCtx').textContent = extras.join(' · ');
  $('dUpdated').textContent = now - data.updatedAt < 60e3 ? 'Updated just now' : 'Updated ' + dur(now - data.updatedAt) + ' ago';
  $('dUpdated').className = stale ? 'stale' : '';

  if (open) setBars();
}

function isPermission(x) {
  if (x.kind) return /permission|elicitation|question/i.test(x.kind);
  return /permission|approve|allow/i.test(x.message || '');
}

let prefs = { soundPermission: true, soundDone: false, soundUi: true }, audioCtx = null;
// Sound design: each sound is a list of tones { f: start Hz, to: end Hz (optional sweep), at: start s, dur: s, gain, bell: adds overtones }
const SOUND_SPECS = {
  // Needs you: bright three-note bell arpeggio, ~1.5 s
  permission: [
    { f: 1046.5, at: 0.00, dur: 1.2, gain: 0.9, bell: true },
    { f: 1318.5, at: 0.14, dur: 1.2, gain: 0.8, bell: true },
    { f: 1568.0, at: 0.28, dur: 1.2, gain: 0.8, bell: true },
  ],
  // Finished: calm two-note falling chime, ~1.5 s
  done: [
    { f: 784.0, at: 0.00, dur: 1.3, gain: 0.8, bell: true },
    { f: 523.3, at: 0.22, dur: 1.3, gain: 0.8, bell: true },
  ],
  // Open: quick rising pop. Close: soft falling drop.
  open: [{ f: 520, to: 980, at: 0, dur: 0.16, gain: 0.55 }],
  close: [{ f: 900, to: 480, at: 0, dur: 0.16, gain: 0.45 }],
};
SOUND_SPECS.test = SOUND_SPECS.permission;

function synth(spec) {
  const rate = 44100, total = Math.max(...spec.map(t => t.at + t.dur)) + 0.05, len = Math.ceil(rate * total);
  const mix = new Float32Array(len);
  for (const t of spec) {
    const start = Math.floor(t.at * rate), n = Math.floor(t.dur * rate);
    let phase = 0;
    for (let i = 0; i < n && start + i < len; i++) {
      const x = i / n, tt = i / rate;
      const f = t.to ? t.f + (t.to - t.f) * x : t.f;
      phase += 2 * Math.PI * f / rate;
      const attack = Math.min(1, tt / 0.008);
      const env = t.bell ? attack * Math.exp(-tt * 3.2) : attack * Math.sin(Math.PI * Math.min(1, x * 1.15)) * (1 - x);
      let v = Math.sin(phase);
      if (t.bell) v += 0.35 * Math.sin(2 * phase) * Math.exp(-tt * 5) + 0.12 * Math.sin(3 * phase) * Math.exp(-tt * 8);
      mix[start + i] += v * env * t.gain;
    }
  }
  let peak = 0; for (const v of mix) peak = Math.max(peak, Math.abs(v));
  const scale = peak ? 0.85 / peak : 1;
  const buf = new ArrayBuffer(44 + len * 2), dv = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + len * 2, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, len * 2, true);
  for (let i = 0; i < len; i++) dv.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, mix[i] * scale)) * 32767), true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const SOUNDS = {};
function chime(kind) {
  if (kind === 'permission' && !prefs.soundPermission) return;
  if (kind === 'done' && !prefs.soundDone) return;
  if ((kind === 'open' || kind === 'close') && !prefs.soundUi) return;
  try {
    SOUNDS[kind] = SOUNDS[kind] || synth(SOUND_SPECS[kind]);
    const a = new Audio(SOUNDS[kind]); a.volume = kind === 'open' || kind === 'close' ? 0.6 : 1;
    a.play().then(() => console.log('[island] sound played:', kind)).catch((e) => {
      console.warn('[island] audio blocked, using system beep:', e && e.message);
      if (kind !== 'open' && kind !== 'close') window.island && window.island.beep && window.island.beep();
    });
  } catch (e) {
    console.warn('[island] sound failed:', e && e.message);
  }
}

function sessionView(x, now) {
  if (x.state === 'needs-you' && isPermission(x)) return { st: 'needs', label: x.kind === 'question' ? 'Has a question' : 'Needs your help', cls: 'red' };
  if (x.state === 'working' && now - x.t < 20 * 60e3) return { st: 'working', label: 'Working', cls: 'grn' };
  if ((x.state === 'done' || x.state === 'needs-you') && now - x.t < 30 * 60e3) return { st: 'ready', label: 'Ready', cls: 'wht' };
  return { st: 'idle', label: 'Idle', cls: '' };
}

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let lastStates = {}, lastDotsHtml = '', lastListHtml = '';

function renderActivity() {
  const now = Date.now();
  const all = activity && activity.sessions ? Object.entries(activity.sessions) : [];
  const fresh = all.filter(([, x]) => now - (x.t || 0) < 2 * 3600e3).sort((a, b) => b[1].t - a[1].t).slice(0, 4);
  const views = fresh.map(([id, x]) => ({ id, x, v: sessionView(x, now) }));

  // collapsed dots: one per session (or a single gray dot)
  const dots = views.length ? views.map(({ v }) => `<span class="act ${v.st === 'idle' ? '' : v.st}"></span>`).join('') : '<span class="act"></span>';
  if (lastDotsHtml !== dots) { $('dots').innerHTML = dots; lastDotsHtml = dots; }

  // expanded list
  const list = views.length ? views.map(({ x, v }) => `<div class="srow"><span class="act ${v.st === 'idle' ? '' : v.st}"></span><span class="p">${esc(x.project || 'Claude Code')}</span><span class="s ${v.cls}">${v.label}</span>${x.last ? `<span class="d">${esc(x.last)}</span>` : ''}</div>`).join('')
    : '<div class="lbl" style="padding:4px 0">No active sessions</div>';
  if (lastListHtml !== list) { $('sessList').innerHTML = list; lastListHtml = list; if (open) isl.style.height = det.offsetHeight + 'px'; }

  // pop-ups + sounds on transitions to red
  if (activity) {
    for (const { id, x, v } of views) {
      const key = v.label + ':' + x.t;
      const was = lastStates[id];
      if (lastAct !== 'idle-init' && v.st === 'needs' && (!was || !was.startsWith(v.label))) {
        popMsg(`${x.project || 'Claude'} needs your help`, 'var(--red)'); chime('permission');
      }
      if (lastAct !== 'idle-init' && v.st === 'ready' && was && !was.startsWith('Ready') && now - x.t < 60e3) {
        popMsg(`${x.project || 'Claude'} finished`, '#f2f2f2'); chime('done');
      }
      lastStates[id] = key;
    }
    lastAct = 'ready';
  }
}

function setBars() {
  if (!data) return;
  const now = Date.now();
  const fivePct = data.five && data.five.resetsAt && now > data.five.resetsAt ? 0 : data.five ? data.five.pct : 0;
  $('b5').style.width = Math.min(100, fivePct) + '%';
  $('b5').style.background = barColor(fivePct);
  $('bWk').style.width = Math.min(100, data.week ? data.week.pct : 0) + '%';
  $('bWk').style.background = barColor(data.week ? data.week.pct : 0);
  $('bFa').style.width = Math.min(100, data.fable ? data.fable.pct : 0) + '%';
}

function setOpen(o) {
  if (o !== open) chime(o ? 'open' : 'close');
  open = o;
  isl.classList.toggle('open', o);
  if (o) {
    isl.style.width = '420px';
    isl.style.height = det.offsetHeight + 'px';
    isl.style.borderRadius = '32px';
    setBars();
  } else {
    isl.style.width = ''; isl.style.height = ''; isl.style.borderRadius = '';
    ['b5', 'bWk', 'bFa'].forEach(id => $(id).style.width = '0');
  }
}

isl.addEventListener('click', () => setOpen(!open));
isl.addEventListener('mouseenter', () => { clearTimeout(collapseTimer); window.island && window.island.setMouseOver(true); });
isl.addEventListener('mouseleave', () => {
  window.island && window.island.setMouseOver(false);
  clearTimeout(collapseTimer);
  collapseTimer = setTimeout(() => open && setOpen(false), 6000);
});

if (window.island && window.island.onTestSound) window.island.onTestSound(() => chime('test'));
if (window.island && window.island.onPrefs) window.island.onPrefs((p) => { prefs = { ...prefs, ...p }; });
if (window.island && window.island.onActivity) window.island.onActivity((d) => { activity = d; renderActivity(); });
